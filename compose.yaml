name: logicc2api

services:
  logicc2api:
    build: .
    image: logicc2api:local
    init: true
    restart: unless-stopped
    environment:
      PORT: "${LOGICC_PORT:-18789}"
      LOGICC_API_KEY: "${LOGICC_API_KEY:-}"
      LOGICC_ADMIN_PASSWORD: "${LOGICC_ADMIN_PASSWORD:-}"
    ports:
      - "${LOGICC_PORT:-18789}:${LOGICC_PORT:-18789}"
    volumes:
      - logicc-data:/app/data

volumes:
  logicc-data:
